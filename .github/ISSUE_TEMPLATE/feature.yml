name: Feature request
description: A new option, visual, layout or card.
labels: [enhancement]
body:
  - type: dropdown
    id: card
    attributes:
      label: Card
      options:
        - tile-card-pro
        - poster-card-pro
        - tile-group-card-pro
        - heading-card-pro
        - multi-trend-card-pro
        - sun-path-card-pro
        - sun-azimuth-card-pro
        - weather-card-pro
        - power-flow-card-pro
        - energy-flow-card-pro
        - layout-card-pro
        - swipe-card-pro
        - entity-card-pro (deprecated)
        - entity-group-card-pro (deprecated)
        - entity-sections-card-pro (deprecated)
        - wind-card-pro (deprecated)
        - rain-card-pro (deprecated)
        - illuminance-card-pro (deprecated)
        - a new card
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you want to show or do
      description: The dashboard situation, not the implementation. A sketch or screenshot of another card helps.
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: How the YAML could look
      render: yaml
