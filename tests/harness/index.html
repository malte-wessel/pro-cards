<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pro Cards test harness</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { padding: 16px; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
      #root { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(56px, auto); gap: 8px; width: 400px; box-sizing: border-box; padding: 16px; border-radius: 12px; }
      #root > .cell { min-width: 0; display: flex; flex-direction: column; }
      #root > .cell.fixed > * { height: 100%; }
      #root > .cell:not(.fixed) > * { flex: none; }
    </style>
  </head>
  <body class="ha-theme">
    <div id="root" class="ha-theme"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
