<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pro Cards test harness</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body { padding: 16px; font-family: Roboto, "Segoe UI", system-ui, sans-serif; }
      /* like Home Assistant's sections grid (hui-grid-section): auto row tracks, and a cell with
         fixed rows gets a definite height (56 px rows, 8 px gaps); the card takes it only if it
         asks for it (the fit-rows attribute), as in HA, where it sits in an inline hui-card */
      #root { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: auto; gap: 8px; width: 400px; box-sizing: border-box; padding: 16px; border-radius: 12px; }
      #root > .cell { min-width: 0; position: relative; }
      #root > .cell.fixed { height: calc(var(--rows) * 64px - 8px); }
    </style>
  </head>
  <body class="ha-theme">
    <div id="root" class="ha-theme"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
