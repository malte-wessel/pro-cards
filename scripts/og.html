<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pro Cards social preview</title>
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b1020;
        color: #ffffff;
        font-family:
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 96px;
        box-sizing: border-box;
      }
      .mark {
        position: relative;
        width: 240px;
        height: 240px;
        flex-shrink: 0;
      }
      .mark::before {
        content: "";
        position: absolute;
        inset: -80px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(47, 91, 245, 0.55), rgba(106, 27, 240, 0.25), transparent);
        filter: blur(40px);
      }
      .mark svg {
        position: relative;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .pro {
        color: #4fb4ff;
      }
      .sub {
        margin: 20px 0 0;
        max-width: 700px;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.3;
        color: #a9b4c6;
      }
      .url {
        margin: 28px 0 0;
        font-size: 22px;
        font-weight: 500;
        color: #7aa8ff;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="240" height="240" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="pcTop" x1="8" y1="8" x2="56" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4FD1FF" />
            <stop offset="1" stop-color="#2F5BF5" />
          </linearGradient>
          <linearGradient id="pcLow" x1="8" y1="32" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7AA8FF" />
            <stop offset="1" stop-color="#6A1BF0" />
          </linearGradient>
        </defs>
        <path
          d="M8 44 L32 56 L56 44"
          stroke="url(#pcLow)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M8 32 L32 44 L56 32"
          stroke="url(#pcLow)"
          stroke-opacity=".6"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M32 8 L56 20 L32 32 L8 20 Z"
          stroke="url(#pcTop)"
          stroke-width="5"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <div>
      <h1><span class="pro">Pro</span> Cards</h1>
      <p class="sub">Beautiful, customizable cards for Home Assistant dashboards</p>
      <p class="url">malte-wessel.github.io/pro-cards</p>
    </div>
  </body>
</html>
