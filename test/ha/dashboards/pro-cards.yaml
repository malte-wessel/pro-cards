# One section per card, using the entities from test/ha/configuration.yaml (named like the docs'
# demo world) and the demo integration's sun. Edit in place; HA reloads YAML dashboards on refresh.
title: Pro Cards
views:
  - title: Cards
    path: cards
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Entity card
          - type: custom:entity-card-pro
            entity: sensor.living_room_temperature
            name: Living room
            decimals: 1
            rules:
              - { below: 19, color: blue, icon: mdi:snowflake, label: Cold }
              - { below: 23, color: green, icon: mdi:thermometer, label: Comfortable }
              - {
                  above: 23,
                  color: orange,
                  icon: mdi:sun-thermometer,
                  label: Warm,
                  tint_card: true,
                }
          - type: custom:entity-card-pro
            entity: sensor.robot_battery
            name: Robot battery
            visual: ring
            rules:
              - { below: 20, color: red }
              - { above: 20, color: green }
          - type: custom:entity-card-pro
            entity: sensor.power_consumption
            name: Power
            visual: sparkline
            hours_to_show: 6
          - type: custom:entity-card-pro
            entity: binary_sensor.window_kitchen
            name: Kitchen window
            visual: strip
            hours_to_show: 12
            bucket_minutes: 30
            rules:
              - { state: "on", color: amber, label: Open }
              - { state: "off", color: grey, label: Closed }
          - type: custom:entity-card-pro
            entity: light.living_room
            name: Living room light
            toggle: true
            hold_action: { action: more-info }
      - type: grid
        cards:
          - type: heading
            heading: Entity group card
          - type: custom:entity-group-card-pro
            title: Living room
            icon: mdi:sofa
            layout: row
            align: space-between
            header_entities:
              - { entity: sensor.living_room_temperature, decimals: 1 }
            entities:
              - { entity: light.living_room, name: Light, tap_action: toggle }
              - { entity: light.dining_table, name: Dining, tap_action: toggle }
              - { entity: cover.living_room_blinds, name: Blinds }
              - { entity: switch.coffee_machine, name: Coffee, tap_action: toggle }
          - type: custom:entity-group-card-pro
            title: Energy
            layout: list
            hours_to_show: 12
            bucket_minutes: 60
            entities:
              - { entity: sensor.power_consumption, visual: bar, min: 0, max: 2500, decimals: 0 }
              - { entity: sensor.solar_power, visual: columns }
              - entity: sensor.washer_status
                name: Washing machine
                attribute: progress
                unit: "%"
                visual: bar
          - type: custom:entity-group-card-pro
            title: Actions run by Home Assistant
            entities:
              - entity: light.kitchen
                name: Confirm before toggling
                tap_action: { action: toggle, confirmation: { text: Toggle the kitchen light? } }
              - entity: light.office
                name: Assist
                icon: mdi:microphone
                tap_action: { action: assist, start_listening: false }
              - entity: sensor.outdoor_temperature
                name: Navigate to the map
                icon: mdi:map
                tap_action: { action: navigate, navigation_path: /map }
      - type: grid
        cards:
          - type: heading
            heading: Entity sections card
          - type: custom:entity-sections-card-pro
            title: Kitchen
            icon: mdi:silverware-fork-knife
            header_entities:
              - { entity: sensor.outdoor_temperature, decimals: 1 }
            sections:
              - layout: row
                align: space-between
                entities:
                  - { entity: light.kitchen, name: Light, tap_action: toggle }
                  - { entity: binary_sensor.window_kitchen, name: Window }
                  - { entity: switch.coffee_machine, name: Coffee, tap_action: toggle }
              - layout: table
                entities:
                  - { entity: sensor.kitchen_window_battery, name: Window battery }
                  - { entity: sensor.outdoor_humidity, name: Humidity }
      - type: grid
        cards:
          - type: heading
            heading: Multi trend card
          - type: custom:multi-trend-card-pro
            title: Outdoor
            hours_to_show: 6
            x_axis: true
            y_axis: true
            entities:
              - { entity: sensor.outdoor_temperature, name: Temperature, color: orange }
              - { entity: sensor.outdoor_humidity, name: Humidity, color: blue }
          - type: custom:multi-trend-card-pro
            title: Power (overlay)
            hours_to_show: 12
            entities:
              - { entity: sensor.power_consumption, name: Consumption }
      - type: grid
        cards:
          - type: heading
            heading: Sun path card
          - type: custom:sun-path-card-pro
            title: Sun
            labels: { sunrise: Sunrise, sunset: Sunset, dawn: Dawn, noon: Noon, dusk: Dusk }
      - type: grid
        cards:
          - type: heading
            heading: Illuminance card
          - type: custom:illuminance-card-pro
            entity: sensor.illuminance
            mode: arc
          - type: custom:illuminance-card-pro
            entity: sensor.illuminance
            mode: trend
          - type: custom:illuminance-card-pro
            entity: sensor.illuminance
            mode: band
            bucket_minutes: 30
      - type: grid
        cards:
          - type: heading
            heading: Wind card
          - type: custom:wind-card-pro
            entity: sensor.wind_speed
            direction: sensor.wind_direction
            gust: sensor.wind_gust
          - type: custom:wind-card-pro
            entity: sensor.wind_speed
            direction: sensor.wind_direction
            gust: sensor.wind_gust
            visual: flow
            flow: { style: lines }
          - type: custom:wind-card-pro
            entity: weather.demo_weather_south
            title: Wind
            layout: hero
            flow: { style: vectors, height: 140 }
            rules:
              - { below: 5, color: blue-grey, label: Calm }
              - { below: 20, color: teal, label: Light breeze }
              - { below: 35, color: amber, label: Fresh }
              - { below: 50, color: orange, label: Strong }
              - { above: 50, color: red, label: Storm, tint_card: true }
      - type: grid
        cards:
          - type: heading
            heading: Rain card
          - type: custom:rain-card-pro
            entity: sensor.rain_rate_roof
            today: sensor.rain_today
          - type: custom:rain-card-pro
            entity: sensor.rain_rate_roof
            today: sensor.rain_today
            visual: flow
            flow: { style: ripples }
          - type: custom:rain-card-pro
            entity: sensor.rain_rate_roof
            today: sensor.rain_today
            wind: sensor.wind_speed
            direction: sensor.wind_direction
            title: Rain
            layout: hero
            flow: { style: fill, height: 140 }
            rules:
              - { below: 0.1, color: blue-grey, label: Dry }
              - { below: 2.5, color: light-blue, label: Light rain }
              - { below: 7.6, color: blue, label: Moderate rain }
              - { above: 7.6, color: indigo, label: Heavy rain, tint_card: true }
      - type: grid
        cards:
          - type: heading
            heading: Power flow card
          - type: custom:power-flow-card-pro
            home: sensor.power_consumption
            expensive_above: 0.35
            idle_links: faint
            sources:
              - { type: solar, entity: sensor.solar_power }
              - { type: battery, power: sensor.battery_power, soc: sensor.battery_soc }
              - type: grid
                power: sensor.grid_power
                price: sensor.electricity_price
                offline: binary_sensor.grid_outage
                generator: sensor.generator_power
                fossil: sensor.grid_fossil_percentage
            consumers:
              - { entity: sensor.ev_charger_power, name: EV, icon: mdi:car-electric }
              - { entity: sensor.heat_pump_power, name: Heat pump, icon: mdi:heat-pump }
          - type: custom:power-flow-card-pro
            title: Energy
            icon: mdi:lightning-bolt
            home: sensor.power_consumption
            sources:
              - { type: solar, entity: sensor.solar_power }
              - { type: battery, power: sensor.battery_power, soc: sensor.battery_soc }
              - { type: grid, power: sensor.grid_power }
            consumers:
              - group: Laundry
                icon: mdi:washing-machine
                entities:
                  - { entity: sensor.washer_power, name: Washer, icon: mdi:washing-machine }
                  - { entity: sensor.dryer_power, name: Dryer, icon: mdi:tumble-dryer }
              - { entity: sensor.heat_pump_power, name: Heat pump, icon: mdi:heat-pump }
          - type: custom:power-flow-card-pro
            home: sensor.power_consumption
            direction: down
            flow_style: arrows
            sources:
              - { type: solar, entity: sensor.solar_power }
              - { type: battery, power: sensor.battery_power, soc: sensor.battery_soc }
              - { type: grid, power: sensor.grid_power }
            consumers:
              - { entity: sensor.heat_pump_power, name: Heat pump, icon: mdi:heat-pump }
              - { entity: sensor.washer_power, name: Washer, icon: mdi:washing-machine }
            consumer_style: list
      - type: grid
        cards:
          - type: heading
            heading: Weather card
          - type: custom:weather-card-pro
            entity: weather.demo_weather_south
          - type: custom:weather-card-pro
            entity: weather.demo_weather_south
            title: Weather
            temperature_rules:
              - { below: 12, color: blue, label: Cool }
              - { below: 20, color: green, label: Mild }
              - { above: 20, color: amber, label: Warm }
            sections:
              - { type: hero }
              - { type: row, entities: [humidity, wind_speed, pressure] }
              - { type: trend, mode: hourly, hours: 12 }
              - { type: forecast, mode: daily, days: 5 }
      - type: grid
        cards:
          - type: heading
            heading: Controls · icons
          # icons inside controls: Home Assistant's icon aligns to the middle of the text line, so
          # every round button, chip, lead button and header icon here must sit centred. The tile
          # loads Home Assistant's ha-state-icon, which the cards then use (as on most dashboards)
          - type: tile
            entity: light.living_room
          - type: custom:entity-group-card-pro
            title: Buttons
            icon: mdi:palette
            header_entities:
              - { entity: light.living_room }
            entities:
              - name: Scenes
                icon: mdi:palette
                control: buttons
                control_options:
                  - { entity: light.living_room, icon: mdi:sofa-single, color: orange }
                  - { entity: light.kitchen, icon: mdi:weather-sunset-down, color: orange }
                  - { entity: light.office, icon: mdi:white-balance-sunny, color: amber }
                  - { entity: light.dining_table, color: indigo }
                  - { icon: mdi:cog, action: { action: navigate, navigation_path: /config } }
              - name: Chips
                icon: mdi:gesture-tap-button
                control: buttons
                control_position: block
                control_options:
                  - { entity: light.kitchen, label: Kitchen, icon: mdi:silverware, color: teal }
                  - { entity: switch.coffee_machine, label: Coffee, color: brown }
              - { entity: cover.living_room_blinds, control: buttons }
          - type: custom:entity-group-card-pro
            layout: row
            entities:
              - { entity: light.living_room, name: Ceiling, control: button }
              - { entity: light.kitchen, name: Kitchen, control: hold, control_position: lead }
              - { entity: switch.coffee_machine, name: Coffee, control: toggle }
